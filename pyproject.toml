[project]
name = "life"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pygame>=2.6.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"