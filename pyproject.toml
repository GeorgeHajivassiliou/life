[project]
name = "life"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pygame>=2.6.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest]
pythonpath = ["."]
testpaths = ["game/tests"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]
